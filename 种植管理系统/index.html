<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苹果种植知识模型系统 v2.2</title>
<style>
:root {
  --bg: #f5f5f0;
  --surface: #ffffff;
  --sidebar: #fafaf7;
  --border: #e0ddd5;
  --text: #2c2c2c;
  --muted: #8a8a7a;
  --accent: #2d7d46;
  --accent-light: #e8f5e9;
  --danger: #c0392b;
  --warning: #e67e22;
  --info: #2980b9;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); line-height: 1.5; overflow: hidden; height: 100vh; }
#app { display: flex; height: 100vh; }
#sidebar { width: 280px; min-width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
#main { flex: 1; overflow-y: auto; padding: 20px 24px; background: var(--bg); }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.sidebar-header h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
.sidebar-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sidebar-section { padding: 8px 0; border-bottom: 1px solid var(--border); }
.sidebar-section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 4px 16px; }
.sidebar-actions { padding: 8px 16px; display: flex; gap: 4px; flex-wrap: wrap; }
.item-row { display: flex; align-items: center; padding: 6px 16px; cursor: pointer; transition: background .15s; gap: 6px; position: relative; }
.item-row:hover { background: rgba(0,0,0,.03); }
.item-row.active { background: var(--accent-light); border-left: 3px solid var(--accent); }
.item-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.item-row .label { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-row .del { font-size: 14px; color: var(--muted); opacity: 0; transition: opacity .15s; cursor: pointer; padding: 0 2px; }
.item-row:hover .del { opacity: 1; }
.item-row .del:hover { color: var(--danger); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); }
.panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fcfcf9; }
.panel-header h2 { font-size: 14px; font-weight: 600; }
.panel-body { padding: 12px 16px; }
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); cursor: pointer; transition: all .15s; white-space: nowrap; }
.btn:hover { background: #f0efe8; border-color: #ccc; }
.btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-sm { padding: 3px 10px; font-size: 11px; }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: #fdecea; }
.btn-secondary { background: #f0efe8; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 6px 8px; font-weight: 600; font-size: 11px; color: var(--muted); border-bottom: 2px solid var(--border); white-space: nowrap; }
.data-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:hover { background: #fafaf7; }
.form-row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 120px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-family: var(--font); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,125,70,.15); }
.form-group textarea { resize: vertical; }
.required { color: var(--danger); }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: var(--surface); border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.2); max-width: 720px; width: 90%; max-height: 85vh; display: flex; flex-direction: column; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-close { font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 24px; border-radius: 6px; font-size: 13px; font-weight: 500; background: #333; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); z-index: 2000; transition: opacity .3s; }
.toast.hidden { opacity: 0; pointer-events: none; }
.toast-success { background: var(--accent); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--info); }
.tag { display: inline-block; padding: 1px 6px; font-size: 10px; border-radius: 3px; font-weight: 500; }
.tag-scope { background: #e3f2fd; color: #1565c0; }
.tag-ref { background: #fff3e0; color: #e65100; }
.ref-badge { display: inline-block; padding: 1px 8px; font-size: 10px; font-weight: 400; background: #e8f5e9; color: var(--accent); border-radius: 10px; margin-left: 6px; }
.info-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
.info-row span { white-space: nowrap; }
.tip-card { padding: 8px 12px; background: #fffde7; border: 1px solid #fff9c4; border-radius: 4px; font-size: 12px; color: #6d5a00; margin-top: 8px; }
.bbch-seg { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
.p1 { background: #5c6bc0; } .p2 { background: #26a69a; } .p3 { background: #66bb6a; } .p4 { background: #ffa726; } .p5 { background: #ef5350; } .p6 { background: #ab47bc; } .p7 { background: #42a5f5; } .p8 { background: #8d6e63; } .p9 { background: #5c6bc0; } .p10 { background: #26a69a; } .p11 { background: #66bb6a; } .p12 { background: #ffa726; }
.status-badge { display: inline-block; padding: 2px 8px; font-size: 11px; border-radius: 10px; font-weight: 500; }
.status-pending { background: #fff3e0; color: #e65100; }
.status-progress { background: #e3f2fd; color: #1565c0; }
.status-completed { background: #e8f5e9; color: #2e7d32; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; color: var(--muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.empty-state p { font-size: 13px; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #aaa; }
@media (max-width: 768px) {
  #sidebar { width: 200px; min-width: 200px; }
  #main { padding: 12px; }
  .form-row { flex-direction: column; gap: 8px; }
  .modal { max-width: 95%; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>🍎 苹果种植知识模型</h1>
      <p>生长模型 · 种植计划 · 观测记录</p>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-sm" id="btnNewModel">+ 新建模型</button>
      <button class="btn btn-sm" id="btnNewPlan">+ 新建计划</button>
      <button class="btn btn-sm" id="btnNewRecord">+ 新建记录</button>
      <button class="btn btn-sm" id="btnNewDataCollection">📊 新建采集</button>
      <button class="btn btn-sm" id="btnNewWorkOrder">📋 新建派工单</button>
      <button class="btn btn-sm" id="btnNewWorkRecord">📝 新建作业记录</button>
      <button class="btn btn-sm" id="btnExport">📦 导入/导出</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">🏠 基地管理</div>
      <div id="baseNav"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">🌳 生长模型</div>
      <div id="modelList"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">📋 种植计划</div>
      <div id="planList"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">📊 数据采集</div>
      <div id="dataCollectionList"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">📋 派工单</div>
      <div id="workOrderList"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">📝 作业记录</div>
      <div id="workRecordList"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">💰 成本分析</div>
      <div id="costAnalysisList">
        <div class="item-row" data-type="costanalysis" data-view="overview">
          <span class="dot" style="background:#e74c3c"></span>
          <span class="label">成本对比总览</span>
        </div>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="emptyState" class="empty-state">
      <div class="icon">🌱</div>
      <h2>欢迎使用苹果种植知识模型系统</h2>
      <p>从左侧选择一个模型、计划或记录，或点击「+ 新建模型」开始</p>
      <p style="margin-top:8px;font-size:11px">快捷键: Ctrl+N 新建 · Ctrl+S 保存 · Esc 关闭弹窗</p>
    </div>
    <div id="mainView" class="hidden"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="data.js"></script>
<script src="state.js"></script>
<script src="utils.js"></script>
<script src="views.js"></script>
<script src="views_base.js"></script>
<script src="modals.js"></script>
<script src="app.js"></script>
</body>
</html>
